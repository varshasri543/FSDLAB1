<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Number Analyzer</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; }
    input, button { padding: 8px; margin: 10px 0; font-size: 16px; }
    #result { margin-top: 20px; white-space: pre-wrap; background: #f0f0f0; padding: 15px; border-radius: 5px; }
  </style>
</head>
<body>

  <h2>Number Analyzer</h2>
  <label for="numInput">Enter a number:</label><br />
  <input type="number" id="numInput" min="0" />
  <br />
  <button onclick="analyzeNumber()">Analyze</button>

  <div id="result"></div>

  <script>
    function analyzeNumber() {
      const num = parseInt(document.getElementById("numInput").value);
      if (isNaN(num) || num < 0) {
        alert("Please enter a valid non-negative number");
        return;
      }

      let output = `Analyzing number: ${num}\n\n`;
      output += `1. Factorial: ${getFactorial(num)}\n`;
      output += `2. Fibonacci series up to ${num}: ${getFibonacciSeries(num).join(', ')}\n`;
      output += `3. Prime numbers up to ${num}: ${getPrimesUpTo(num).join(', ')}\n`;
      output += `4. Is Palindrome? ${isPalindrome(num) ? "Yes ✅" : "No ❌"}`;

      document.getElementById("result").innerText = output;
    }

    function getFactorial(n) {
      if (n < 0) return "Not defined for negative numbers";
      let result = 1;
      for (let i = 2; i <= n; i++) result *= i;
      return result;
    }

    function getFibonacciSeries(n) {
      if (n < 0) return [];
      let series = [0];
      if (n === 0) return series;
      let a = 0, b = 1;
      while (b <= n) {
        series.push(b);
        let next = a + b;
        a = b;
        b = next;
      }
      return series;
    }

    function getPrimesUpTo(n) {
      let primes = [];
      for (let i = 2; i <= n; i++) {
        let isPrime = true;
        for (let j = 2; j <= Math.sqrt(i); j++) {
          if (i % j === 0) {
            isPrime = false;
            break;
          }
        }
        if (isPrime) primes.push(i);
      }
      return primes;
    }

    function isPalindrome(n) {
      const str = n.toString();
      return str === str.split('').reverse().join('');
    }
  </script>
</body>
</html>
