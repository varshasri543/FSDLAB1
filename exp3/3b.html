<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedding Audio and Video</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: darkblue;
        }
        .media {
            margin: 20px auto;
            padding: 15px;
            background: #fff;
            border-radius: 8px;
            width: 70%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <h1>🎵 Audio and 🎬 Video Embedding Example</h1>

  
    <div class="media">
        <h2>Audio Example</h2>
        <p>Listen to this sample audio:</p>
        <audio controls>
            <source src="Doraemon - Doraemon no uta_default.mp3" type="audio/mpeg">
           
            Your browser does not support the audio element.
        </audio>
    </div>

    <div class="media">
        <h2>Video Example</h2>
        <p>Watch this sample video:</p>
        <video width="500" height="300" controls>
            <source src="video.mp4" type="video/mp4">
            
            Your browser does not support the video tag.
        </video>
    </div>

</body>
</html>
