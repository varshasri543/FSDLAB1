<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Types Example</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #f0f8ff;
            font-family: Arial, sans-serif;
        }
        h2 {
            color: crimson;
        }
    </style>
</head>
<body>

    <h1>Different Types of CSS Styles</h1>
    <h2>This heading is styled with Internal CSS</h2>
    <p style="color: purple; font-weight: bold;">
        This paragraph is styled with Inline CSS
    </p>
    <p>This paragraph is styled with External CSS.</p>

</body>
</html>
